<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Entrar | Área restrita</title>
	<link rel="stylesheet" href="../style.css">
</head>
<body>
	<main class="page-shell">
		<section class="auth-card" aria-labelledby="login-title">
			<div class="brand-mark" aria-hidden="true">A</div>
			<p class="eyebrow">Área restrita</p>
			<h1 id="login-title">Entrar na sua conta</h1>
			<p class="intro">Acesse o sistema usando seus dados de cadastro.</p>

			<form id="login-form" class="auth-form">
				<label for="email">E-mail</label>
				<input type="email" id="email" name="email" autocomplete="email" required>

				<label for="senha">Senha</label>
				<input type="password" id="senha" name="senha" autocomplete="current-password" required>

				<button type="submit" class="button button-primary">Entrar</button>
			</form>

			<div class="divider"><span>ou</span></div>
			<button type="button" id="google-login" class="button button-google">Entrar com Google</button>
			<p class="form-footer">Ainda não possui uma conta? <a href="../cadastro/cadastro.html">Cadastre-se</a></p>
		</section>
	</main>
	<script type="module" src="login.js"></script>
</body>
</html>
