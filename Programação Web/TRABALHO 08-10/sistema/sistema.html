<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sistema | Área restrita</title>
	<link rel="stylesheet" href="../style.css">
</head>
<body>
	<main class="page-shell">
		<section class="dashboard-card" aria-labelledby="welcome-title">
			<div class="dashboard-topline">
				<span class="status-dot" aria-hidden="true"></span>
				<span>Área restrita</span>
				<button type="button" id="logout-button" class="button button-logout">Sair</button>
			</div>
			<p class="eyebrow">Painel principal</p>
			<h1 id="welcome-title">Bem-vindo(a)!</h1>
			<p id="user-email" class="user-email"></p>
			<div class="access-panel">
				<span class="access-label">Status da sessão</span>
				<strong>Autenticado</strong>
			</div>
		</section>
	</main>
	<script type="module" src="sistema.js"></script>
</body>
</html>
